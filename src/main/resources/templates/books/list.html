<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}"></head>
<body>

    <div th:replace="~{fragments/header :: navbar}"></div>

    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 th:text="${titre}"></h1>
            <a href="/books/new" class="btn btn-primary">+ Nouveau Livre</a>
        </div>

        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Titre</th>
                    <th>Auteur</th>
                    <th>Édition</th>
                    <th>Date Publication</th>
                    <th>Statut</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="book : ${books}" th:if="${books.size() > 0}">
                    <td th:text="${book.id}"></td>
                    <td th:text="${book.titre}"></td>
                    <td th:text="${book.auteur}"></td>
                    <td th:text="${book.edition}"></td>
                    <td th:text="${#dates.format(book.datePublication, 'dd/MM/yyyy')}"></td>
                    <td>
                        <span th:if="${book.disponible}" class="badge bg-success">Disponible</span>
                        <span th:if="${!book.disponible}" class="badge bg-danger">Emprunté</span>
                    </td>
                    <td>
                    <a th:href="@{/books/edit/{id}(id=${book.id})}" class="btn btn-sm btn-warning">Modifier</a>
                    <a th:href="@{/books/delete/{id}(id=${book.id})}" 
                         class="btn btn-sm btn-danger"
                        onclick="return confirm('Voulez-vous vraiment supprimer ce livre ?')">Supprimer</a>
                    </td>
                </tr>
                <tr th:if="${books.isEmpty()}">
                    <td colspan="7" class="text-center py-4">Aucun livre enregistré pour le moment.</td>
                </tr>
            </tbody>
        </table>

        <a href="/" class="btn btn-secondary">← Retour Accueil</a>
    </div>

</body>
</html>
